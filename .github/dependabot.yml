version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/terraform/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/terraform/environments/dev
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/terraform/environments/prod
    schedule:
      interval: weekly

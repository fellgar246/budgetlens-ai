name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://budgetlens:budgetlens_local_only@127.0.0.1:5433/budgetlens
  APP_ENV: test
  AUTH_MODE: dev

jobs:
  changes:
    name: Changeset / path detection
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.classify.outputs.api }}
      web: ${{ steps.classify.outputs.web }}
      contract: ${{ steps.classify.outputs.contract }}
      e2e: ${{ steps.classify.outputs.e2e }}
      terraform: ${{ steps.classify.outputs.terraform }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - id: classify
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/ci_changes.py --event "${{ github.event_name }}" --base "${{ github.base_ref }}"

  api:
    name: API lint, types, unit, integration
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: budgetlens
          POSTGRES_PASSWORD: budgetlens_local_only
          POSTGRES_DB: budgetlens
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U budgetlens -d budgetlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Format and lint
        working-directory: apps/api
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations
      - name: Type check
        working-directory: apps/api
        run: uv run pyright
      - name: Unit tests
        working-directory: apps/api
        run: uv run pytest -m "not integration and not perf"
      - name: Integration tests
        working-directory: apps/api
        run: uv run pytest -m integration
      - name: Coverage gates
        working-directory: apps/api
        run: |
          uv run pytest tests/unit/domain \
            --cov=budgetlens.domain.money --cov=budgetlens.domain.variance \
            --cov=budgetlens.domain.fiscal --cov=budgetlens.domain.financial_entry \
            --cov-branch --cov-fail-under=85 --cov-report=term-missing
          uv run pytest -m "not perf" \
            --cov=budgetlens --cov-report=term-missing --cov-fail-under=75

  contract:
    name: OpenAPI / client drift
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - working-directory: apps/api
        run: uv sync --frozen
      - name: OpenAPI contract
        working-directory: apps/api
        run: uv run pytest tests/unit/test_openapi.py

  web:
    name: Web lint, types, unit, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: [changes, api, web]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.api.result != 'failure' &&
      needs.web.result != 'failure'
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: budgetlens
          POSTGRES_PASSWORD: budgetlens_local_only
          POSTGRES_DB: budgetlens
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U budgetlens -d budgetlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: uv sync --frozen
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E against a seeded stack
        env:
          APP_ENV: local
          AUTH_MODE: dev
          REQUIRE_E2E: "1"
        run: |
          chmod +x scripts/ci-e2e.sh
          ./scripts/ci-e2e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Dependency and secret scan
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: uv sync --frozen
      - name: Scan dependencies and secrets
        env:
          SCAN_SCOPE: deps,secrets
        run: |
          chmod +x scripts/scan.sh
          ./scripts/scan.sh

  terraform:
    name: Terraform fmt, validate, lint, scan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Install TFLint
        env:
          TFLINT_VERSION: 0.64.0
        run: |
          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" -o /tmp/tflint.zip
          sudo unzip -o /tmp/tflint.zip -d /usr/local/bin
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Checkov
        run: python -m pip install "checkov==3.3.9"
      - name: Scan Terraform
        env:
          SCAN_SCOPE: terraform
        run: |
          chmod +x scripts/scan.sh
          ./scripts/scan.sh

  ci:
    name: CI
    needs: [changes, api, contract, web, e2e, security, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Require selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > /tmp/ci-needs.json
          python scripts/ci_changes.py --gate-needs /tmp/ci-needs.json --selected \
            "api=${{ needs.changes.outputs.api }},web=${{ needs.changes.outputs.web }},contract=${{ needs.changes.outputs.contract }},e2e=${{ needs.changes.outputs.e2e }},terraform=${{ needs.changes.outputs.terraform }},security=${{ needs.changes.outputs.security }}"
